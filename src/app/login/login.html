<section class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-icon">💼</span>
      <div>
        <h1>GiuliCorp</h1>
        <p>Gestión de ventas, sucursales y clientes</p>
      </div>
    </div>

    <div class="login-body">
      <h2>Iniciar sesión</h2>
      <p class="login-subtitle">Ingresá con tu email y contraseña para continuar.</p>

      <form [formGroup]="form" (ngSubmit)="iniciarSesion()" novalidate>
        <label class="field">
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="usuario@giulicorp.com"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small class="field-error">Ingresá un email válido.</small>
          }
        </label>

        <label class="field">
          <span>Contraseña</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <small class="field-error">Ingresá tu contraseña.</small>
          }
        </label>

        @if (error()) {
          <div class="login-error">{{ error() }}</div>
        }

        <button type="submit" class="login-btn" [disabled]="cargando()">
          {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </div>

    <footer class="login-footer">
      <span>Acceso restringido · Roles: empleado, administrador y desarrollador</span>
    </footer>
  </div>
</section>
